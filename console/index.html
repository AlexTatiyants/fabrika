<script>
 /* The scheme, before the first paint -- read here rather than in app/header.js so
    the console never shows one scheme and then swaps to another. Its only
    home is this browser: a scheme is a property of the person looking and of
    the screen they are looking at, not of the factory or the run, so a second
    machine is entitled to a different answer. Nothing is stored until the
    picker is used; with nothing stored, the console opens as it always has. */
 try {
   var s = localStorage.getItem('fabrika:scheme');
   if (s === 'day' || s === 'night') document.documentElement.dataset.theme = s;
 } catch (e) { /* a private window has no storage, and that is not an error */ }
</script>

  <aside class="panel" id="panel" aria-label="Active work">
    <a class="wordmark" href="#/" aria-label="Fabrika — the yard">
      <img src="/static/fabrika-logo.png" alt="Fabrika" width="760" height="200">
    </a>
    <div class="panel-status" id="panel-status" hidden></div>
    <div class="panel-search">
      <input type="search" id="panel-search" placeholder="search the floor…"
             aria-label="Search projects and features" autocomplete="off">
    </div>
    <div class="panel-filters" id="panel-filters" role="group" aria-label="Filter by state">
      <button type="button" class="pfilter on" data-filter="all">All</button>
      <button type="button" class="pfilter" data-filter="needs">Needs you</button>
      <button type="button" class="pfilter" data-filter="building">Building</button>
      <button type="button" class="pfilter" data-filter="idle">Idle</button>
    </div>
    <nav class="panel-body" id="panel-body"></nav>
    <div class="panel-mark" aria-hidden="true"></div>
  </aside>
  <div class="panel-scrim" id="panel-scrim" hidden></div>

  <div id="stale-bar" hidden></div>
  <div id="offline-bar" hidden></div>

  <header class="masthead"><div class="mast-in">
    <button class="panel-toggle" id="panel-toggle" aria-controls="panel"
            aria-expanded="true" aria-label="Hide active work" title="Active work — [">
      <span class="wordmark-mark" aria-hidden="true"></span>
      <span class="pt-chev" aria-hidden="true">‹</span>
    </button>
    <nav class="crumbs" id="crumbs" aria-label="Breadcrumb"></nav>
    <div class="mast-right">
      <span id="mast-nav"></span>
    </div>
  </div></header>

  <!-- The feature bar lives outside #main because #main is a mount point: the
       screens in ui/ own their own DOM and clear it, and the bar is chrome that
       has to survive that. Vanilla screens still build their own inside #main
       and this host stays empty for them. -->
  <div id="featurebar"></div>

  <main id="main" tabindex="-1"></main>

  <!-- The run is the one thing on this page that changes without you touching
       it, and without a live region of its own -- the toast being the only
       other one -- a build finishing, a gate going red, or a question arriving
       would be silent to anyone not watching the screen. -->
  <div id="live" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>

  <div class="toasts" id="toast" role="status" aria-live="polite"></div>

  <!-- The role sheet lives outside #main on purpose. That subtree is rebuilt
       from a string every four seconds, and an editor somebody is typing in
       cannot be rebuilt under them. -->
  <div id="sheet-host"></div>
